version: "3.9"

services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
      pip install streamlit &&
      streamlit run app.py --server.port 8501 --server.address 0.0.0.0
      "
    ports:
      - "8501:8501"